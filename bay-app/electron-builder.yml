appId: com.tee24.bay-kiosk
productName: Tee24 Bay Kiosk
copyright: Copyright © 2026 Tee24
artifactName: Tee24-Bay-Kiosk-Setup-${version}.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# Shipped next to app.asar (process.resourcesPath). screen-ocr.ps1 is the
# Windows-OCR worker the kiosk uses to read GSPro's screen (see src/main/screen.ts).
extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"

# Auto-update + /desktop-app download both read from GitHub Releases on the
# public tee24-booking repo. Tags look like kiosk-v1.2.3 (see .github/workflows).
publish:
  provider: github
  owner: robtee24
  repo: tee24-booking
  releaseType: release
  vPrefixedTagName: false

win:
  # Add build/icon.ico (256x256) to brand the installer; electron-builder falls back to the default icon.
  target:
    - target: nsis
      arch:
        - x64
  # Unsigned for now. The installer will show SmartScreen's "More info → Run anyway".
  signAndEditExecutable: false

nsis:
  oneClick: true
  # Per-user install (%LOCALAPPDATA%\Programs\Tee24 Bay Kiosk). This is what lets
  # auto-update run unattended: a per-machine install marks latest.yml
  # isAdminRightsRequired and electron-updater then launches the installer via
  # elevate.exe, which stops at a UAC prompt nobody at the bay can click.
  # Bays installed per-machine before this change get the per-user copy on
  # their next update; remove the old Program Files copy via Apps & features.
  perMachine: false
  allowToChangeInstallationDirectory: false
  runAfterFinish: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Tee24 Bay Kiosk
  deleteAppDataOnUninstall: false
